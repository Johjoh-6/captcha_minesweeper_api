name: tests

on:
    pull_request:
        branches: [main]

jobs:
    tests:
        name: Tests
        runs-on: ubuntu-latest

        steps:
            - name: Check out code
              uses: actions/checkout@v5

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: "go.mod"

            - name: Test the auth
              run: go test ./... -cover

            - name: Run Gosec Security Scanner
              uses: securego/gosec@master
              with:
                  args: ./...

    style:
        name: Style
        runs-on: ubuntu-latest

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: "go.mod"

            - name: Style
              run: test -z $(go fmt ./...)

            - name: Staticcheck
              uses: dominikh/staticcheck-action@v1
              with:
                  version: "latest"
